# www.mdduck.com always redirects to the canonical HTTPS host.
# Certificate renewal uses Certbot's existing systemd timer and HTTP-01 webroot.
server {
    listen 80;
    server_name www.mdduck.com;
    root /www/wwwroot/mdduck.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://mdduck.com$request_uri;
    }
    access_log /www/wwwlogs/mdduck-www.log;
    error_log /www/wwwlogs/mdduck-www.error.log;
}

server {
    listen 443 ssl http2;
    server_name www.mdduck.com;
    ssl_certificate /etc/letsencrypt/live/www.mdduck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mdduck.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://mdduck.com$request_uri;

    return 301 https://mdduck.com$request_uri;
    access_log /www/wwwlogs/mdduck-www.log;
    error_log /www/wwwlogs/mdduck-www.error.log;
}
